name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit

  e2e:
    name: Playwright e2e
    runs-on: ubuntu-latest
    # The auth-UI specs render client-side only, so no MySQL is needed here.
    env:
      CI: "true"
      BETTER_AUTH_SECRET: ci-placeholder-secret-at-least-32-characters
      BETTER_AUTH_URL: http://127.0.0.1:3100
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: Run e2e tests
        run: npx playwright test
      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  docker:
    name: Docker build + smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: preckon-host:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test (login page renders without a DB)
        run: |
          docker run -d --name preckon \
            -e BETTER_AUTH_SECRET=ci-placeholder-secret-at-least-32-characters \
            -p 3000:3000 preckon-host:ci
          # Wait for the server to answer on the public login route.
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:3000/ || true)
            echo "attempt $i -> $code"
            if [ "$code" = "200" ]; then ok=1; break; fi
            sleep 2
          done
          docker logs preckon
          docker rm -f preckon >/dev/null
          if [ "${ok:-}" != "1" ]; then
            echo "::error::Container did not serve the login page (HTTP 200)"
            exit 1
          fi
