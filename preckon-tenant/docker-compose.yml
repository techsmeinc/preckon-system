# Preckon Tenant plane — one-command local/prod-like run.
#
#   docker compose up --build -d          # db + phpMyAdmin + app + worker
#   docker compose run --rm seed          # register the pack + demo tenant/owner
#
# App:        http://localhost:3100   (login admin@techsme.com / preckon-admin-2026)
# phpMyAdmin: http://localhost:8081    (server: db, user: root, pass: preckon)
# MySQL:      localhost:3308 -> 3306
services:
  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DATABASE_PASSWORD:-preckon}
      MYSQL_DATABASE: ${DATABASE_NAME:-preckon_tenant}
    ports:
      # Loopback only. Published so a developer can point a client at 3308;
      # bound to 127.0.0.1 so a server with a public interface does not put
      # MySQL on the internet the moment it comes up.
      - "127.0.0.1:3308:3306"
    volumes:
      - db_data:/var/lib/mysql
      # Schema runs once, on first init.
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      # Follows the password variable rather than repeating it: the two drifting
      # apart makes a healthy database report unhealthy forever.
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p\"$$MYSQL_ROOT_PASSWORD\""]
      interval: 5s
      timeout: 5s
      retries: 30

  # Root-level database access over HTTP. Behind a profile so it does NOT start
  # with `docker compose up` — run it deliberately with `--profile tools` when
  # you want it, on a machine where that is appropriate.
  phpmyadmin:
    image: phpmyadmin:5
    profiles: ["tools"]
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      PMA_USER: root
      PMA_PASSWORD: ${DATABASE_PASSWORD:-preckon}
      UPLOAD_LIMIT: 64M
    ports:
      - "127.0.0.1:8081:80"

  worker:
    build: ./worker
    restart: unless-stopped
    environment:
      PORT: "4000"
      CORE_URL: http://app:3000
      # The vision pre-pass rasterises PDF drawing sheets through the sidecar.
      # The worker fetches them itself so the images never enter the job
      # envelope — that envelope is a database column, and a rendered sheet is
      # hundreds of KB. Neither service holds a database handle or a credential,
      # so this adds no reach.
      CAD_URL: http://cad:7400
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:?set INTERNAL_SERVICE_TOKEN in .env}
      # Set ANTHROPIC_API_KEY (e.g. in a .env next to this file) to use REAL Claude
      # agents; unset → deterministic stub agents. Model ids are env-overridable.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    ports:
      # Internal. Core reaches it over the compose network as http://worker:4000;
      # this publish is only so a developer can curl the /claude proxy locally.
      - "127.0.0.1:4000:4000"

  # The CAD extraction sidecar (§5.1, same trust boundary as the worker): parses
  # .dxf/.dwg into a measured summary. No DB driver, no credentials, and the
  # uploads volume is read-only — it is a pure function of the bytes it is given.
  cad:
    build: ./cad
    restart: unless-stopped
    environment:
      FILE_STORAGE_DIR: /app/.uploads
      # DWG is proprietary and binary. ezdxf converts it via the ODA File
      # Converter; without it .dwg uploads fail with a clear message telling the
      # estimator to export DXF. .dxf never needs it.
      EZDXF_ODAFC: ${EZDXF_ODAFC:-}
    volumes:
      - uploads:/app/.uploads:ro
    expose:
      - "7400"

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_HOST: db
      DATABASE_PORT: "3306"
      DATABASE_USER: root
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:-preckon}
      DATABASE_NAME: preckon_tenant
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?set BETTER_AUTH_SECRET in .env (32+ random chars)}
      BETTER_AUTH_URL: http://localhost:3100
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:?set INTERNAL_SERVICE_TOKEN in .env}
      WORKER_URL: http://worker:4000
      CAD_URL: http://cad:7400
      CORE_URL: http://app:3000
      FILE_STORAGE_DIR: /app/.uploads
      # Desktop installers, served by /desktop. On a volume rather than in the
      # image: they are ~100 MB each and change on their own cadence, so baking
      # them in would put a hundred-megabyte layer into every deploy of a
      # one-line fix. Publishing a new build is a copy into this volume — no
      # rebuild, no restart.
      DESKTOP_DOWNLOAD_DIR: /app/.downloads
      # Sign-in attempts per minute. Raise only to run the e2e suite, which signs
      # in once per test; leave at the default on anything reachable publicly.
      AUTH_SIGNIN_MAX: ${AUTH_SIGNIN_MAX:-3}
    volumes:
      - uploads:/app/.uploads
      - downloads:/app/.downloads
    ports:
      - "3100:3000"

  # One-off: register the construction pack + seed the demo tenant/owner/project.
  #   docker compose run --rm seed
  seed:
    build:
      context: .
      target: builder
    profiles: ["tools"]
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_HOST: db
      DATABASE_PORT: "3306"
      DATABASE_USER: root
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:-preckon}
      DATABASE_NAME: preckon_tenant
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?set BETTER_AUTH_SECRET in .env (32+ random chars)}
      BETTER_AUTH_URL: http://localhost:3100
      TENANT_OWNER_EMAIL: owner@riverside.build
      TENANT_OWNER_PASSWORD: ${TENANT_OWNER_PASSWORD:?set TENANT_OWNER_PASSWORD in .env}
    command: ["npm", "run", "seed"]

volumes:
  db_data:
  uploads:
  downloads:
